# Paste into a Portainer stack (or `docker compose up -d`). Change only the LEFT side of the volume
# to wherever your collection lives on the host. Keep the right side as /music: that's where the
# server looks (or set MUSIC_DIR to match). It's mounted read-only.
services:
  album-player:
    build: .
    image: album-player:latest
    container_name: album-player
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - /path/to/your/music:/music:ro   # host path : container path (keep /music)
    environment:
      RESCAN_SECONDS: "600"   # refresh the library every 10 min; /albums/library.json?rescan=1 forces it
      QUIET: "1"              # set to 0 to log every request
    # user: "1000:1000"       # match the owner of your music files if uid 1000 can't read them
