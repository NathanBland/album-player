# Paste into a Portainer stack (or `docker compose up -d`). Change the music path on the left of
# the volume to wherever your collection lives on the host; it's mounted read-only.
services:
  album-player:
    build: .
    image: album-player:latest
    container_name: album-player
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - /path/to/your/music:/music:ro
    environment:
      RESCAN_SECONDS: "600"   # refresh the library every 10 min; /albums/library.json?rescan=1 forces it
      QUIET: "1"              # set to 0 to log every request
    # user: "1000:1000"       # match the owner of your music files if uid 1000 can't read them
